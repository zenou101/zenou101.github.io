name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions: {}
concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Refresh public project data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! npm run sync; then
            node -e "const s=require('./public/data/catalog.json').snapshot; if(s.version!==1 || !Array.isArray(s.repos)) process.exit(1)"
            echo "::warning::GitHub data refresh failed. Shipping the checked-in public snapshot."
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
